name: CI Deploy Frontend and Trigger Backend

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/wsgi-and-frontend-api' ]

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://yantrax-backend.onrender.com
        run: npm run build

      - name: Verify VERCEL_TOKEN secret
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is not set. Add the secret 'VERCEL_TOKEN' to the repository settings to enable deployments to Vercel." >&2
            exit 1
          fi
          # Basic structural check: Vercel tokens are non-empty and contain no
          # whitespace (tokens with whitespace indicate broken secret formatting).
          if printf '%s' "$VERCEL_TOKEN" | grep -qE '[[:space:]]'; then
            echo "ERROR: VERCEL_TOKEN contains whitespace. Check the secret value for accidental formatting." >&2
            exit 1
          fi
          echo "VERCEL_TOKEN is present and has a valid format."

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@60.1.3
          DEPLOY_OUTPUT=$(vercel --prod --yes --token "$VERCEL_TOKEN" --cwd . 2>&1)
          echo "$DEPLOY_OUTPUT"
          if ! echo "$DEPLOY_OUTPUT" | grep -qE 'https://[a-zA-Z0-9.-]+\.vercel\.app'; then
            echo "ERROR: Vercel deployment did not produce a valid production URL." >&2
            exit 1
          fi

  trigger_render:
    needs: build_and_deploy_frontend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for service: $RENDER_SERVICE_ID"
          HTTP_STATUS=$(curl -sS -o /tmp/render_deploy.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \\
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Render deploy trigger failed with HTTP status $HTTP_STATUS." >&2
            cat /tmp/render_deploy.json >&2
            exit 1
          fi
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/render_deploy.json')).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$DEPLOY_ID" ]; then
            echo "ERROR: Render deploy response did not contain a deploy ID." >&2
            cat /tmp/render_deploy.json >&2
            exit 1
          fi
          echo "Render deploy triggered successfully: $DEPLOY_ID"

      - name: Verify Render deployment SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          EXPECTED_SHA=$(curl -sS "https://api.github.com/repos/${{ github.repository }}/commits/main" -H "Accept: application/vnd.github+json" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])" 2>/dev/null || echo "")
          if [ -z "$EXPECTED_SHA" ]; then
            echo "ERROR: Could not determine expected main-branch SHA." >&2
            exit 1
          fi
          echo "Expected SHA: $EXPECTED_SHA"
          RENDER_SHA=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \\
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('lastDeployment',{}).get('commitSha','') or d.get('commitSha',''))" 2>/dev/null || echo "")
          if [ -z "$RENDER_SHA" ]; then
            echo "ERROR: Could not read Render last deployment SHA from service metadata." >&2
            exit 1
          fi
          if [ "$RENDER_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Render SHA ($RENDER_SHA) does not match expected main SHA ($EXPECTED_SHA)." >&2
            exit 1
          fi
          echo "Render is running the expected commit."

      - name: Verify live backend health
        run: |
          # Read-only production probe — never triggers /god-cycle or /run-cycle.
          HEALTH=$(curl -sS -m 30 https://yantrax-backend.onrender.com/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status": *"HEALTHY"\|"status":"HEALTHY"' || {
            echo "ERROR: Backend /health did not report HEALTHY." >&2
            exit 1
          }
          echo "Backend /health reports HEALTHY."

      - name: Verify production frontend bundle points at Render backend
        run: |
          # The compiled bundle must reference the Render backend, never localhost.
          curl -sS https://yantrax-frontend.vercel.app/ -o /tmp/index.html
          JS=$(grep -oE '/assets/index-[^.]+\.js' /tmp/index.html | head -1)
          if [ -z "$JS" ]; then
            echo "ERROR: Could not find compiled JS bundle in frontend index." >&2
            exit 1
          fi
          curl -sS "https://yantrax-frontend.vercel.app$JS" -o /tmp/bundle.js
          if grep -q "yantrax-backend.onrender.com" /tmp/bundle.js; then
            echo "Frontend bundle points at the Render backend."
          else
            echo "ERROR: Frontend bundle does not reference yantrax-backend.onrender.com." >&2
            exit 1
          fi
          if grep -q "localhost" /tmp/bundle.js; then
            echo "ERROR: Frontend bundle contains a localhost fallback in production." >&2
            exit 1
          fi
